<svg width="800" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="800" height="480" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="700" fill="rgb(7,7,7)">구직급여 소정급여일수, 나이·가입기간별 지급일수</text>
  <text x="40" y="66" font-size="13" fill="#6b6b6b">50세 미만 가입기간 3~5년 구간이 마침 180일입니다</text>

  <!-- Legend -->
  <rect x="480" y="26" width="16" height="16" fill="#263343"/>
  <text x="502" y="39" font-size="12.5" fill="#3a4a60">50세 미만</text>
  <rect x="600" y="26" width="16" height="16" fill="#1f6feb"/>
  <text x="622" y="39" font-size="12.5" fill="#3a4a60">50세 이상 · 장애인</text>

  <!-- axis -->
  <line x1="70" y1="380" x2="770" y2="380" stroke="#c9ced6" stroke-width="1.5"/>

  <!-- gridlines -->
  <line x1="70" y1="296" x2="770" y2="296" stroke="#eef0f3" stroke-width="1"/>
  <line x1="70" y1="212" x2="770" y2="212" stroke="#eef0f3" stroke-width="1"/>
  <line x1="70" y1="128" x2="770" y2="128" stroke="#eef0f3" stroke-width="1"/>
  <text x="60" y="384" font-size="10.5" fill="#9aa1ab" text-anchor="end">0일</text>
  <text x="60" y="300" font-size="10.5" fill="#9aa1ab" text-anchor="end">90일</text>
  <text x="60" y="216" font-size="10.5" fill="#9aa1ab" text-anchor="end">180일</text>
  <text x="60" y="132" font-size="10.5" fill="#9aa1ab" text-anchor="end">270일</text>

  <!-- Group 1: 1년 미만 (120 / 120) -->
  <rect x="103" y="238" width="40" height="142" fill="#263343"/>
  <rect x="153" y="238" width="40" height="142" fill="#1f6feb"/>
  <text x="123" y="230" font-size="11.5" fill="#263343" text-anchor="middle">120일</text>
  <text x="173" y="230" font-size="11.5" fill="#1f6feb" text-anchor="middle">120일</text>
  <text x="148" y="404" font-size="12" fill="#3a4a60" text-anchor="middle">1년 미만</text>

  <!-- Group 2: 1~3년 (150 / 180) -->
  <rect x="239" y="202" width="40" height="178" fill="#263343"/>
  <rect x="289" y="167" width="40" height="213" fill="#1f6feb"/>
  <text x="259" y="194" font-size="11.5" fill="#263343" text-anchor="middle">150일</text>
  <text x="309" y="159" font-size="11.5" fill="#1f6feb" text-anchor="middle">180일</text>
  <text x="284" y="404" font-size="12" fill="#3a4a60" text-anchor="middle">1~3년</text>

  <!-- Group 3: 3~5년 (180 / 210) -->
  <rect x="375" y="167" width="40" height="213" fill="#263343"/>
  <rect x="425" y="131" width="40" height="249" fill="#1f6feb"/>
  <text x="395" y="159" font-size="11.5" font-weight="700" fill="#c0392b" text-anchor="middle">180일</text>
  <text x="445" y="123" font-size="11.5" fill="#1f6feb" text-anchor="middle">210일</text>
  <text x="420" y="404" font-size="12" fill="#3a4a60" text-anchor="middle">3~5년</text>

  <!-- highlight callout on the 180-day bar -->
  <rect x="370" y="162" width="45" height="223" rx="6" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5,4"/>
  <text x="392" y="60" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">여기가 180일</text>
  <path d="M392,64 C 392,90 393,130 393,158" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Group 4: 5~10년 (210 / 240) -->
  <rect x="511" y="131" width="40" height="249" fill="#263343"/>
  <rect x="561" y="96" width="40" height="284" fill="#1f6feb"/>
  <text x="531" y="123" font-size="11.5" fill="#263343" text-anchor="middle">210일</text>
  <text x="581" y="88" font-size="11.5" fill="#1f6feb" text-anchor="middle">240일</text>
  <text x="556" y="404" font-size="12" fill="#3a4a60" text-anchor="middle">5~10년</text>

  <!-- Group 5: 10년 이상 (240 / 270) -->
  <rect x="647" y="96" width="40" height="284" fill="#263343"/>
  <rect x="697" y="60" width="40" height="320" fill="#1f6feb"/>
  <text x="667" y="88" font-size="11.5" fill="#263343" text-anchor="middle">240일</text>
  <text x="717" y="52" font-size="11.5" fill="#1f6feb" text-anchor="middle">270일</text>
  <text x="692" y="404" font-size="12" fill="#3a4a60" text-anchor="middle">10년 이상</text>

  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M0,0 L4,2 L0,4 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="40" y="440" font-size="11.5" fill="#9aa1ab">가입기간(피보험기간) 구간</text>
</svg>
