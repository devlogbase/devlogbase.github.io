<svg width="800" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="800" height="480" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="700" fill="rgb(7,7,7)">월급이 달라도 실업급여는 거의 같습니다</text>
  <text x="40" y="66" font-size="13" fill="#6b6b6b">2026년 기준, 월급 200만~330만원이면 월 198.1만원, 350만원부터는 월 204.3만원으로 사실상 두 금액뿐입니다</text>

  <!-- Legend -->
  <rect x="470" y="26" width="16" height="16" fill="#c9ced6"/>
  <text x="492" y="39" font-size="12.5" fill="#3a4a60">월급(단순가정)</text>
  <rect x="620" y="26" width="16" height="16" fill="#1f6feb"/>
  <text x="642" y="39" font-size="12.5" fill="#3a4a60">월 실업급여</text>

  <line x1="70" y1="380" x2="770" y2="380" stroke="#c9ced6" stroke-width="1.5"/>

  <!-- floor zone -->
  <rect x="88" y="60" width="410" height="320" rx="8" fill="#f4f6f9"/>
  <text x="293" y="80" font-size="12" font-weight="700" fill="#6b6b6b" text-anchor="middle">하한액(66,048원/일) 적용 구간</text>

  <!-- cap zone -->
  <rect x="512" y="60" width="230" height="320" rx="8" fill="#eaf1ff"/>
  <text x="627" y="80" font-size="12" font-weight="700" fill="#1f6feb" text-anchor="middle">상한액(68,100원/일) 적용 구간</text>

  <!-- Group 1: wage 200 -->
  <rect x="100" y="250" width="34" height="130" fill="#c9ced6"/>
  <rect x="146" y="251" width="34" height="129" fill="#1f6feb"/>
  <text x="117" y="242" font-size="11" fill="#6b6b6b" text-anchor="middle">200만</text>
  <text x="163" y="243" font-size="10.5" font-weight="700" fill="#1f6feb" text-anchor="middle">198.1만</text>
  <text x="140" y="404" font-size="11.5" fill="#3a4a60" text-anchor="middle">월급 200만원</text>

  <!-- Group 2: wage 250 -->
  <rect x="213" y="217" width="34" height="163" fill="#c9ced6"/>
  <rect x="259" y="251" width="34" height="129" fill="#1f6feb"/>
  <text x="230" y="209" font-size="11" fill="#6b6b6b" text-anchor="middle">250만</text>
  <text x="276" y="243" font-size="10.5" font-weight="700" fill="#1f6feb" text-anchor="middle">198.1만</text>
  <text x="253" y="404" font-size="11.5" fill="#3a4a60" text-anchor="middle">월급 250만원</text>

  <!-- Group 3: wage 300 -->
  <rect x="326" y="184" width="34" height="196" fill="#c9ced6"/>
  <rect x="372" y="251" width="34" height="129" fill="#1f6feb"/>
  <text x="343" y="176" font-size="11" fill="#6b6b6b" text-anchor="middle">300만</text>
  <text x="389" y="243" font-size="10.5" font-weight="700" fill="#1f6feb" text-anchor="middle">198.1만</text>
  <text x="366" y="404" font-size="11.5" fill="#3a4a60" text-anchor="middle">월급 300만원</text>

  <!-- Group 4: wage 330 -->
  <rect x="439" y="165" width="34" height="215" fill="#c9ced6"/>
  <rect x="485" y="251" width="34" height="129" fill="#1f6feb"/>
  <text x="456" y="157" font-size="11" fill="#6b6b6b" text-anchor="middle">330만</text>
  <text x="502" y="243" font-size="10.5" font-weight="700" fill="#1f6feb" text-anchor="middle">198.1만</text>
  <text x="479" y="404" font-size="11.5" fill="#3a4a60" text-anchor="middle">월급 330만원</text>

  <!-- Group 5: wage 350 -->
  <rect x="552" y="152" width="34" height="228" fill="#c9ced6"/>
  <rect x="598" y="247" width="34" height="133" fill="#1f6feb"/>
  <text x="569" y="144" font-size="11" fill="#6b6b6b" text-anchor="middle">350만</text>
  <text x="615" y="239" font-size="10.5" font-weight="700" fill="#1f6feb" text-anchor="middle">204.3만</text>
  <text x="592" y="404" font-size="11.5" fill="#3a4a60" text-anchor="middle">월급 350만원</text>

  <!-- Group 6: wage 450 -->
  <rect x="665" y="87" width="34" height="293" fill="#c9ced6"/>
  <rect x="711" y="247" width="34" height="133" fill="#1f6feb"/>
  <text x="682" y="79" font-size="11" fill="#6b6b6b" text-anchor="middle">450만</text>
  <text x="728" y="239" font-size="10.5" font-weight="700" fill="#1f6feb" text-anchor="middle">204.3만</text>
  <text x="705" y="404" font-size="11.5" fill="#3a4a60" text-anchor="middle">월급 450만원</text>

  <text x="40" y="440" font-size="11.5" fill="#9aa1ab">단위: 만원 · 3개월 임금이 월급과 동일하고 소정근로시간이 8시간이라고 가정한 단순 계산</text>
</svg>
