<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">자기주식의 네 단계</text>

  <!-- 매입 -->
  <rect x="40" y="70" width="170" height="86" rx="10" fill="#eaf3fc" stroke="#046bd2" stroke-width="1.5"/>
  <text x="125" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#046bd2">1. 매입 (취득)</text>
  <text x="125" y="123" text-anchor="middle" font-size="13" fill="#333">회사가 자기 주식을</text>
  <text x="125" y="141" text-anchor="middle" font-size="13" fill="#333">시장에서 사들임</text>

  <!-- 보유 -->
  <rect x="235" y="70" width="170" height="86" rx="10" fill="#eaf3fc" stroke="#046bd2" stroke-width="1.5"/>
  <text x="320" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#046bd2">2. 보유</text>
  <text x="320" y="123" text-anchor="middle" font-size="13" fill="#333">자기주식 계정에</text>
  <text x="320" y="141" text-anchor="middle" font-size="13" fill="#333">그대로 들고 있음</text>

  <!-- arrow 1->2 -->
  <line x1="210" y1="113" x2="233" y2="113" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- branch from 보유 -->
  <line x1="320" y1="156" x2="320" y2="188" stroke="#888" stroke-width="2"/>
  <line x1="150" y1="188" x2="490" y2="188" stroke="#888" stroke-width="2"/>
  <line x1="150" y1="188" x2="150" y2="214" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <line x1="490" y1="188" x2="490" y2="214" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- 소각 -->
  <rect x="55" y="216" width="190" height="110" rx="10" fill="#e6f6ec" stroke="#1a9e54" stroke-width="1.5"/>
  <text x="150" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#1a9e54">3-A. 소각</text>
  <text x="150" y="268" text-anchor="middle" font-size="13" fill="#333">주식을 없애버림</text>
  <text x="150" y="289" text-anchor="middle" font-size="13" fill="#333">발행주식 수 감소</text>
  <text x="150" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#1a9e54">주당 가치 상승</text>

  <!-- 처분 -->
  <rect x="395" y="216" width="190" height="110" rx="10" fill="#fdecec" stroke="#d23b3b" stroke-width="1.5"/>
  <text x="490" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#d23b3b">3-B. 처분</text>
  <text x="490" y="268" text-anchor="middle" font-size="13" fill="#333">다시 시장에 내다 팜</text>
  <text x="490" y="289" text-anchor="middle" font-size="13" fill="#333">유통주식 수 다시 증가</text>
  <text x="490" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#d23b3b">물량 부담으로 작용</text>

  <text x="320" y="360" text-anchor="middle" font-size="12.5" fill="#666">2026년 3월 개정 상법 : 매입한 자기주식은 원칙적으로 1년 안에 소각</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#888"/>
    </marker>
  </defs>
</svg>
