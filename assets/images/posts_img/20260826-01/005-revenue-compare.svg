<svg width="800" height="440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="rgb(7,7,7)">2분기 매출 : 직전 분기 vs 자체 가이던스 vs 시장 컨센서스</text>
  <text x="40" y="68" font-size="14" fill="#6b6b6b">단위 : 억 달러 (컨센서스는 발표 시점까지 변동 가능)</text>

  <!-- gridlines -->
  <g stroke="#eeeeee" stroke-width="1">
    <line x1="90" y1="360" x2="760" y2="360"/>
    <line x1="90" y1="290" x2="760" y2="290"/>
    <line x1="90" y1="220" x2="760" y2="220"/>
    <line x1="90" y1="150" x2="760" y2="150"/>
    <line x1="90" y1="100" x2="760" y2="100"/>
  </g>
  <text x="80" y="365" font-size="11" fill="#9a9a9a" text-anchor="end">0</text>
  <text x="80" y="295" font-size="11" fill="#9a9a9a" text-anchor="end">300</text>
  <text x="80" y="225" font-size="11" fill="#9a9a9a" text-anchor="end">600</text>
  <text x="80" y="155" font-size="11" fill="#9a9a9a" text-anchor="end">900</text>
  <text x="80" y="105" font-size="11" fill="#9a9a9a" text-anchor="end">1000</text>

  <!-- bar 1: 1Q actual 816.2 -->
  <rect x="150" y="106" width="120" height="254" rx="6" fill="#263343"/>
  <text x="210" y="94" font-size="16" font-weight="700" fill="#263343" text-anchor="middle">816.2</text>
  <text x="210" y="382" font-size="13" fill="#6b6b6b" text-anchor="middle">1분기 실적</text>
  <text x="210" y="400" font-size="11" fill="#9a9a9a" text-anchor="middle">(2~4월, 확정치)</text>

  <!-- bar 2: guidance 910 -->
  <rect x="340" y="76" width="120" height="284" rx="6" fill="#046bd2"/>
  <text x="400" y="64" font-size="16" font-weight="700" fill="#046bd2" text-anchor="middle">910</text>
  <text x="400" y="382" font-size="13" fill="#6b6b6b" text-anchor="middle">2분기 자체 가이던스</text>
  <text x="400" y="400" font-size="11" fill="#9a9a9a" text-anchor="middle">(±2%, 5월 제시)</text>

  <!-- bar 3: consensus 922 -->
  <rect x="530" y="68" width="120" height="292" rx="6" fill="#1e7e34"/>
  <text x="590" y="56" font-size="16" font-weight="700" fill="#1e7e34" text-anchor="middle">922</text>
  <text x="590" y="382" font-size="13" fill="#6b6b6b" text-anchor="middle">시장 컨센서스</text>
  <text x="590" y="400" font-size="11" fill="#9a9a9a" text-anchor="middle">(애널리스트 평균)</text>

  <rect x="90" y="410" width="670" height="0"/>
</svg>
