<svg width="800" height="360" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="800" height="360" fill="#ffffff"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="rgb(7,7,7)">다음 배당(3분기)을 받으려면 언제까지 사야 할까</text>
  <text x="40" y="70" font-size="14" fill="#6b6b6b">2026년 9월 30일이 배당 기준일인 경우의 매수 마감 스케줄</text>

  <!-- timeline base -->
  <line x1="90" y1="180" x2="710" y2="180" stroke="#d8dadf" stroke-width="3"/>

  <!-- node 1: 9/28 last buy day -->
  <circle cx="150" cy="180" r="9" fill="#263343"/>
  <text x="150" y="150" font-size="16" font-weight="700" fill="#263343" text-anchor="middle">9월 28일(월)</text>
  <text x="150" y="212" font-size="14" fill="rgb(7,7,7)" text-anchor="middle" font-weight="600">매수 마감일</text>
  <text x="150" y="232" font-size="12" fill="#6b6b6b" text-anchor="middle">이날 장 마감까지 사야</text>
  <text x="150" y="248" font-size="12" fill="#6b6b6b" text-anchor="middle">배당을 받습니다</text>

  <!-- node 2: 9/29 ex-dividend -->
  <circle cx="400" cy="180" r="9" fill="#8a97a8"/>
  <text x="400" y="150" font-size="16" font-weight="700" fill="#263343" text-anchor="middle">9월 29일(화)</text>
  <text x="400" y="212" font-size="14" fill="rgb(7,7,7)" text-anchor="middle" font-weight="600">배당락일</text>
  <text x="400" y="232" font-size="12" fill="#6b6b6b" text-anchor="middle">이날 사면 이번 배당은</text>
  <text x="400" y="248" font-size="12" fill="#6b6b6b" text-anchor="middle">받을 수 없습니다</text>

  <!-- node 3: 9/30 record date -->
  <circle cx="650" cy="180" r="9" fill="#b9c2cf" stroke="#263343" stroke-width="2"/>
  <text x="650" y="150" font-size="16" font-weight="700" fill="#263343" text-anchor="middle">9월 30일(수)</text>
  <text x="650" y="212" font-size="14" fill="rgb(7,7,7)" text-anchor="middle" font-weight="600">배당 기준일</text>
  <text x="650" y="232" font-size="12" fill="#6b6b6b" text-anchor="middle">주주명부에 등재된</text>
  <text x="650" y="248" font-size="12" fill="#6b6b6b" text-anchor="middle">주주 확정일</text>

  <text x="40" y="292" font-size="13" fill="rgb(7,7,7)">국내 주식은 매수 후 결제까지 2영업일(T+2)이 걸려서, 기준일 당일이 아니라 <tspan font-weight="700">2영업일 전</tspan>까지 매수를 마쳐야 합니다.</text>
  <text x="40" y="316" font-size="12" fill="#6b6b6b">1·2분기 모두 기준일로부터 정확히 59일 뒤 지급됐습니다. 같은 간격이면 3분기는 11월 하순 지급이 유력하지만, 정식 결의는 컨퍼런스콜에서 확정됩니다.</text>

  <text x="40" y="346" font-size="12" fill="#9a9a9a">※ 2026년 3분기 기준일 9월 30일 기준 역산 · 실제 지급 여부·일정은 이사회 결의로 확정됩니다</text>
</svg>
