<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="620" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="310" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#111111">6개월 뒤(2027년 2월) 기준금리 전망</text>
  <text x="310" y="54" text-anchor="middle" font-size="13" fill="#666666">금통위원 7명이 3표씩, 모두 21표</text>

