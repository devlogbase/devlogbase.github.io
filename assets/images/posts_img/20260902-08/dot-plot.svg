  <g>
    <circle cx="225" cy="228" r="12" fill="#046bd2"/>
    <circle cx="255" cy="228" r="12" fill="#046bd2"/>
    <circle cx="285" cy="228" r="12" fill="#046bd2"/>
    <circle cx="315" cy="228" r="12" fill="#046bd2"/>
    <circle cx="345" cy="228" r="12" fill="#046bd2"/>
    <circle cx="375" cy="228" r="12" fill="#046bd2"/>
    <circle cx="405" cy="228" r="12" fill="#046bd2"/>
    <circle cx="435" cy="228" r="12" fill="#046bd2"/>
    <circle cx="465" cy="228" r="12" fill="#046bd2"/>
    <circle cx="495" cy="228" r="12" fill="#046bd2"/>
  </g>
  <text x="595" y="234" text-anchor="end" font-size="20" font-weight="700" fill="#046bd2">10표</text>

