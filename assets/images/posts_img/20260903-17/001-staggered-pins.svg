<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="500" height="600" fill="#ffffff"/>
  <text x="250" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">USB 3.0 Type-A 커넥터의 2단 접점</text>

  <!-- Connector cross-section -->
  <g transform="translate(30,58)">
    <rect x="0" y="20" width="440" height="86" rx="6" fill="#f0f2f5" stroke="#c4c9d0" stroke-width="1.5"/>
    <text x="220" y="12" text-anchor="middle" font-size="13" fill="#555">플러그가 들어오는 방향  →</text>

    <rect x="24" y="36" width="70" height="16" rx="3" fill="#e8a33d"/>
    <rect x="24" y="72" width="70" height="16" rx="3" fill="#e8a33d"/>
    <text x="59" y="127" text-anchor="middle" font-size="13" fill="#a86a12">USB 2.0 핀</text>
    <text x="59" y="143" text-anchor="middle" font-size="12" fill="#a86a12">(입구에 가까움)</text>

    <rect x="320" y="36" width="96" height="16" rx="3" fill="#3d7de8"/>
    <rect x="320" y="72" width="96" height="16" rx="3" fill="#3d7de8"/>
    <text x="368" y="127" text-anchor="middle" font-size="13" fill="#1f5bb5">SuperSpeed 핀</text>
    <text x="368" y="143" text-anchor="middle" font-size="12" fill="#1f5bb5">(안쪽에 위치)</text>

    <line x1="120" y1="64" x2="300" y2="64" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="210" y="59" text-anchor="middle" font-size="12" fill="#777">약 2~3mm 차이</text>
  </g>

  <!-- Fast scenario -->
  <g transform="translate(30,240)">
    <text x="0" y="0" font-size="15" font-weight="700" fill="#1f7a33">빠르게 한 번에 꽂을 때</text>
    <line x1="0" y1="24" x2="440" y2="24" stroke="#c4c9d0" stroke-width="2"/>
    <circle cx="40" cy="24" r="6" fill="#e8a33d"/>
    <circle cx="66" cy="24" r="6" fill="#3d7de8"/>
    <text x="53" y="48" text-anchor="middle" font-size="12.5" fill="#555">두 접점이 거의 동시에 닿음</text>
    <rect x="0" y="60" width="440" height="30" rx="5" fill="#e7f4ea" stroke="#b4d7bd"/>
    <text x="220" y="80" text-anchor="middle" font-size="13" fill="#1f7a33" font-weight="600">SuperSpeed 협상 성공, USB 3.0 속도</text>
  </g>

  <!-- Slow scenario -->
  <g transform="translate(30,380)">
    <text x="0" y="0" font-size="15" font-weight="700" fill="#b5321f">천천히 밀어 넣을 때</text>
    <line x1="0" y1="24" x2="440" y2="24" stroke="#c4c9d0" stroke-width="2"/>
    <circle cx="30" cy="24" r="6" fill="#e8a33d"/>
    <text x="30" y="46" text-anchor="middle" font-size="12" fill="#555">2.0 핀</text>
    <text x="30" y="60" text-anchor="middle" font-size="12" fill="#555">먼저 접촉</text>
    <circle cx="215" cy="24" r="6" fill="#888"/>
    <text x="215" y="46" text-anchor="middle" font-size="12" fill="#555">2.0 장치로</text>
    <text x="215" y="60" text-anchor="middle" font-size="12" fill="#555">열거 완료</text>
    <circle cx="410" cy="24" r="6" fill="#3d7de8"/>
    <text x="410" y="46" text-anchor="middle" font-size="12" fill="#555">SS 핀 접촉</text>
    <text x="410" y="60" text-anchor="middle" font-size="12" fill="#b5321f">(무시됨)</text>
    <rect x="0" y="78" width="440" height="30" rx="5" fill="#fbe9e7" stroke="#e0b4ac"/>
    <text x="220" y="98" text-anchor="middle" font-size="13" fill="#b5321f" font-weight="600">USB 2.0 모드로 고정, 다시 꽂기 전까지 유지</text>
  </g>
</svg>
