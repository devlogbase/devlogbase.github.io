<svg width="640" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
  <defs>
    <marker id="arrowStep" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#263343"/>
    </marker>
    <marker id="arrowLoop" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8a94a3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>

  <text x="320" y="30" font-size="20" font-weight="700" fill="rgb(7,7,7)" text-anchor="middle">GSD Core의 5단계 루프</text>
  <text x="320" y="54" font-size="13" fill="#6b6b6b" text-anchor="middle">Discuss → Plan → Execute → Verify → Ship</text>

  <!-- Step 1: Discuss -->
  <circle cx="80" cy="80" r="14" fill="#1f6feb"/>
  <text x="80" y="85" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="32" y="98" width="96" height="90" rx="10" fill="#263343"/>
  <text x="80" y="133" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Discuss</text>
  <text x="80" y="158" font-size="11" fill="#a9b3c1" text-anchor="middle">결정 기록</text>

  <!-- Step 2: Plan -->
  <circle cx="200" cy="80" r="14" fill="#1f6feb"/>
  <text x="200" y="85" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="152" y="98" width="96" height="90" rx="10" fill="#263343"/>
  <text x="200" y="133" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Plan</text>
  <text x="200" y="158" font-size="11" fill="#a9b3c1" text-anchor="middle">작업 분해</text>

  <!-- Step 3: Execute -->
  <circle cx="320" cy="80" r="14" fill="#1f6feb"/>
  <text x="320" y="85" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="272" y="98" width="96" height="90" rx="10" fill="#263343"/>
  <text x="320" y="133" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Execute</text>
  <text x="320" y="158" font-size="11" fill="#a9b3c1" text-anchor="middle">병렬 실행</text>

  <!-- Step 4: Verify -->
  <circle cx="440" cy="80" r="14" fill="#1f6feb"/>
  <text x="440" y="85" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="392" y="98" width="96" height="90" rx="10" fill="#263343"/>
  <text x="440" y="133" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Verify</text>
  <text x="440" y="158" font-size="11" fill="#a9b3c1" text-anchor="middle">검증</text>

  <!-- Step 5: Ship -->
  <circle cx="560" cy="80" r="14" fill="#1f6feb"/>
  <text x="560" y="85" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="512" y="98" width="96" height="90" rx="10" fill="#263343"/>
  <text x="560" y="133" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Ship</text>
  <text x="560" y="158" font-size="11" fill="#a9b3c1" text-anchor="middle">PR 생성</text>

  <!-- Forward arrows -->
  <line x1="130" y1="143" x2="150" y2="143" stroke="#263343" stroke-width="2.5" marker-end="url(#arrowStep)"/>
  <line x1="250" y1="143" x2="270" y2="143" stroke="#263343" stroke-width="2.5" marker-end="url(#arrowStep)"/>
  <line x1="370" y1="143" x2="390" y2="143" stroke="#263343" stroke-width="2.5" marker-end="url(#arrowStep)"/>
  <line x1="490" y1="143" x2="510" y2="143" stroke="#263343" stroke-width="2.5" marker-end="url(#arrowStep)"/>

  <!-- Loop-back arrow -->
  <path d="M 560 190 C 560 252, 80 252, 80 190" fill="none" stroke="#8a94a3" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrowLoop)"/>
  <text x="320" y="278" font-size="12" fill="#6b6b6b" text-anchor="middle">각 마일스톤마다 이 순서를 처음부터 다시 반복한다</text>
</svg>
