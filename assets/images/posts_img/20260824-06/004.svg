<svg width="840" height="360" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="840" height="360" fill="#ffffff"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="rgb(7,7,7)">10월과 내년 1월, 두 단계로 나뉜 시행</text>
  <text x="40" y="70" font-size="14" fill="#6b6b6b">8·13 부동산 금융대책 청년·신혼부부 지원 시행 일정</text>

  <!-- baseline -->
  <line x1="90" y1="290" x2="780" y2="290" stroke="#d8dadf" stroke-width="1.5"/>

  <!-- connecting line -->
  <polyline points="150,250 460,150 750,110" fill="none" stroke="#263343" stroke-width="3"/>

  <!-- point 1: 발표 -->
  <circle cx="150" cy="250" r="7" fill="#b9c2cf" stroke="#263343" stroke-width="2"/>
  <text x="150" y="229" font-size="15" font-weight="700" fill="#263343" text-anchor="middle">정책 발표</text>
  <text x="150" y="315" font-size="13" fill="rgb(7,7,7)" text-anchor="middle" font-weight="600">2026년 8월 13일</text>
  <text x="150" y="333" font-size="12" fill="#6b6b6b" text-anchor="middle">금융위원회 8·13 부동산 금융대책</text>

  <!-- point 2: 10월 -->
  <circle cx="460" cy="150" r="7" fill="#046bd2" stroke="#263343" stroke-width="2"/>
  <text x="460" y="108" font-size="13" fill="#046bd2" text-anchor="middle" font-weight="600">보금자리론 1인 소득 인정 · 전세대출보증 만39세</text>
  <text x="460" y="127" font-size="15" font-weight="700" fill="#263343" text-anchor="middle">소득기준 완화·보증 확대</text>
  <text x="460" y="315" font-size="13" fill="rgb(7,7,7)" text-anchor="middle" font-weight="600">2026년 10월</text>
  <text x="460" y="333" font-size="12" fill="#6b6b6b" text-anchor="middle">시행</text>

  <!-- point 3: 27년1월 -->
  <circle cx="750" cy="110" r="8" fill="#263343" stroke="#263343" stroke-width="2"/>
  <text x="750" y="87" font-size="16" font-weight="700" fill="#263343" text-anchor="middle">신설 상품 출시</text>
  <text x="750" y="315" font-size="13" fill="rgb(7,7,7)" text-anchor="middle" font-weight="600">2027년 1월(잠정)</text>
  <text x="750" y="333" font-size="12" fill="#6b6b6b" text-anchor="middle">청년미래보금자리론</text>
  <text x="750" y="347" font-size="12" fill="#6b6b6b" text-anchor="middle">전월세결합보증</text>

  <text x="40" y="352" font-size="12" fill="#9a9a9a">출처: 금융위원회 8·13 부동산 금융대책 보도자료(2026.08.13) · 세부 일정은 확정 발표에 따라 달라질 수 있음</text>
</svg>
