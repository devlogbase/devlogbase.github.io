<svg width="800" height="460" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="800" height="460" fill="#ffffff"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="rgb(7,7,7)">같은 주, 정반대로 움직인 서울 아파트값</text>
  <text x="40" y="72" font-size="14" fill="#6b6b6b">2026년 8월 17일 기준, 전주 대비 변동률(한국부동산원)</text>

  <!-- baseline -->
  <line x1="300" y1="100" x2="300" y2="410" stroke="#d8dbe0" stroke-width="1.5"/>
  <text x="300" y="430" font-size="12" fill="#9a9a9a" text-anchor="middle">0%</text>

  <!-- 서초 -->
  <text x="40" y="122" font-size="14" font-weight="600" fill="rgb(7,7,7)">서초구</text>
  <rect x="255" y="106" width="45" height="24" rx="4" fill="#c94f4f"/>
  <text x="243" y="122" font-size="13" font-weight="700" fill="#c94f4f" text-anchor="end">-0.09%</text>

  <!-- 강남 -->
  <text x="40" y="162" font-size="14" font-weight="600" fill="rgb(7,7,7)">강남구</text>
  <rect x="275" y="146" width="25" height="24" rx="4" fill="#c94f4f"/>
  <text x="263" y="162" font-size="13" font-weight="700" fill="#c94f4f" text-anchor="end">-0.05%</text>

  <!-- 송파 -->
  <text x="40" y="202" font-size="14" font-weight="600" fill="rgb(7,7,7)">송파구</text>
  <rect x="300" y="186" width="50" height="24" rx="4" fill="#9aa4b0"/>
  <text x="358" y="202" font-size="13" font-weight="700" fill="#5a6270">+0.10%</text>

  <!-- 도봉 -->
  <text x="40" y="242" font-size="14" font-weight="600" fill="rgb(7,7,7)">도봉구</text>
  <rect x="300" y="226" width="155" height="24" rx="4" fill="#263343"/>
  <text x="463" y="242" font-size="13" font-weight="700" fill="#263343">+0.31%</text>

  <!-- 강북 -->
  <text x="40" y="282" font-size="14" font-weight="600" fill="rgb(7,7,7)">강북구</text>
  <rect x="300" y="266" width="205" height="24" rx="4" fill="#263343"/>
  <text x="513" y="282" font-size="13" font-weight="700" fill="#263343">+0.41%</text>

  <!-- 서대문 -->
  <text x="40" y="322" font-size="14" font-weight="600" fill="rgb(7,7,7)">서대문구</text>
  <rect x="300" y="306" width="220" height="24" rx="4" fill="#263343"/>
  <text x="528" y="322" font-size="13" font-weight="700" fill="#263343">+0.44%</text>

  <!-- 중랑 -->
  <text x="40" y="362" font-size="14" font-weight="600" fill="rgb(7,7,7)">중랑구</text>
  <rect x="300" y="346" width="220" height="24" rx="4" fill="#263343"/>
  <text x="528" y="362" font-size="13" font-weight="700" fill="#263343">+0.44%</text>

  <!-- 성북 -->
  <text x="40" y="402" font-size="14" font-weight="600" fill="rgb(7,7,7)">성북구</text>
  <rect x="300" y="386" width="225" height="24" rx="4" fill="#263343"/>
  <text x="533" y="402" font-size="13" font-weight="700" fill="#263343">+0.45%</text>

  <text x="40" y="440" font-size="12" fill="#9a9a9a">강남 3구는 하락, 중저가 외곽은 상승 폭 확대</text>
</svg>
