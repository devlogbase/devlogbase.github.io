<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 448" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="480" height="448" fill="#ffffff"/>
  <text x="24" y="34" font-size="19" font-weight="700" fill="#1a1a1a">조춘청랑 전체 서사 한눈에</text>
  <text x="24" y="56" font-size="12" fill="#888">넷플릭스 19화까지 공개 기준 (2026년 9월 7일)</text>

  <line x1="40" y1="86" x2="40" y2="388" stroke="#d0d7e2" stroke-width="3"/>

  <!-- 1 -->
  <circle cx="40" cy="100" r="13" fill="#046bd2"/>
  <text x="40" y="105" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="66" y="97" font-size="15" font-weight="700" fill="#1a1a1a">입사와 첫 만남</text>
  <text x="66" y="117" font-size="12.5" fill="#555">상즈타오가 광고회사 입사, 독설 상사 뤄녠과 출장 중 사고로 가까워짐</text>

  <!-- 2 -->
  <circle cx="40" cy="168" r="13" fill="#046bd2"/>
  <text x="40" y="173" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="66" y="165" font-size="15" font-weight="700" fill="#1a1a1a">비밀 사내연애</text>
  <text x="66" y="185" font-size="12.5" fill="#555">협업 프로젝트로 관계가 깊어지고, 사내에 숨긴 채 연애를 이어감</text>

  <!-- 3 -->
  <circle cx="40" cy="236" r="13" fill="#046bd2"/>
  <text x="40" y="241" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="66" y="233" font-size="15" font-weight="700" fill="#1a1a1a">지위 격차와 갈등</text>
  <text x="66" y="253" font-size="12.5" fill="#555">공개 징계, 질투, 예전 남자친구와의 재회 등으로 관계가 흔들림</text>

  <!-- 4 -->
  <circle cx="40" cy="304" r="13" fill="#046bd2"/>
  <text x="40" y="309" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="66" y="301" font-size="15" font-weight="700" fill="#1a1a1a">19화, 미래를 고민하다</text>
  <text x="66" y="321" font-size="12.5" fill="#555">즈타오의 이직 기회와 뤄녠의 건강 문제로 두 사람이 앞날을 생각함</text>

  <!-- 5 -->
  <circle cx="40" cy="372" r="13" fill="#e0752d"/>
  <text x="40" y="377" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="66" y="369" font-size="15" font-weight="700" fill="#1a1a1a">이별과 재회 (20~21화, 미공개)</text>
  <text x="66" y="389" font-size="12.5" fill="#555">원작에서는 이별 뒤 상즈타오가 하얼빈으로 떠나고 4년 후 재회</text>
  <text x="66" y="425" font-size="12.5" fill="#999">넷플릭스 21화(9월 9일)로 완결. 20화는 9월 8일 공개</text>
</svg>
