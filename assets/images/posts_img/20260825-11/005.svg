<svg width="800" height="440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="rgb(7,7,7)">온체인 교차검증 — 실현가 대비 현재가 위치</text>
  <text x="40" y="70" font-size="14" fill="#6b6b6b">MVRV 비율 1.2대, 실현가 5만2,750달러 기준(8월 8일 집계)</text>

  <!-- horizontal price scale -->
  <line x1="80" y1="230" x2="740" y2="230" stroke="#d9d9d9" stroke-width="2"/>

  <!-- realized price marker -->
  <circle cx="220" cy="230" r="7" fill="#6b6b6b"/>
  <line x1="220" y1="230" x2="220" y2="180" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="220" y="168" font-size="13" font-weight="700" fill="#6b6b6b" text-anchor="middle">실현가 $52,750</text>
  <text x="220" y="256" font-size="12" fill="#9a9a9a" text-anchor="middle">보유자 평균 원가</text>

  <!-- current price marker -->
  <circle cx="560" cy="230" r="7" fill="#046bd2"/>
  <line x1="560" y1="230" x2="560" y2="180" stroke="#046bd2" stroke-width="1.5"/>
  <text x="560" y="168" font-size="13" font-weight="700" fill="#046bd2" text-anchor="middle">현재가 $80,600</text>
  <text x="560" y="256" font-size="12" fill="#9a9a9a" text-anchor="middle">MVRV 약 1.5배 수준</text>

  <!-- gap bracket -->
  <path d="M220,290 L220,300 L560,300 L560,290" fill="none" stroke="#046bd2" stroke-width="1.5"/>
  <text x="390" y="318" font-size="12" fill="#046bd2" text-anchor="middle">약 53% 위, 2021·2024 고점권(Z-Score 7+)에는 미달</text>

  <!-- bottom stat cards -->
  <g>
    <rect x="60" y="340" width="210" height="70" rx="8" fill="#f4f6f8"/>
    <text x="75" y="364" font-size="12" fill="#6b6b6b">MVRV Z-Score(8/8)</text>
    <text x="75" y="392" font-size="20" font-weight="700" fill="rgb(7,7,7)">0.42</text>
  </g>
  <g>
    <rect x="295" y="340" width="210" height="70" rx="8" fill="#f4f6f8"/>
    <text x="310" y="364" font-size="12" fill="#6b6b6b">공포탐욕지수(8/25)</text>
    <text x="310" y="392" font-size="20" font-weight="700" fill="rgb(7,7,7)">74 (탐욕)</text>
  </g>
  <g>
    <rect x="530" y="340" width="210" height="70" rx="8" fill="#f4f6f8"/>
    <text x="545" y="364" font-size="12" fill="#6b6b6b">1년+ 보유물량 30일 변화</text>
    <text x="545" y="392" font-size="20" font-weight="700" fill="rgb(7,7,7)">-2.9%</text>
  </g>

  <text x="40" y="430" font-size="12" fill="#9a9a9a">실현가·MVRV Z-Score는 8월 8~11일 집계 기준 근사치이며 이후 가격 반영이 아직 안 됨</text>
</svg>
