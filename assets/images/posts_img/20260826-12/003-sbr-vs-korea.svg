<svg width="800" height="460" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="800" height="460" fill="#ffffff"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="rgb(7,7,7)">미국 SBR vs 한국 몰수 가상자산 처분</text>
  <text x="40" y="70" font-size="14" fill="#6b6b6b">국가가 사들이는 미국과, 이미 국고에 있는 걸 파는 한국은 방향이 반대입니다</text>

  <!-- table frame -->
  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="40" y1="100" x2="760" y2="100"/>
    <line x1="40" y1="160" x2="760" y2="160"/>
    <line x1="40" y1="220" x2="760" y2="220"/>
    <line x1="40" y1="280" x2="760" y2="280"/>
    <line x1="40" y1="340" x2="760" y2="340"/>
    <line x1="40" y1="400" x2="760" y2="400"/>
  </g>
  <g stroke="#d8d8d8" stroke-width="1">
    <line x1="220" y1="100" x2="220" y2="400"/>
    <line x1="490" y1="100" x2="490" y2="400"/>
  </g>

  <!-- header row -->
  <rect x="40" y="100" width="180" height="60" fill="#f7f7f7"/>
  <rect x="220" y="100" width="270" height="60" fill="#fdf3f0"/>
  <rect x="490" y="100" width="270" height="60" fill="#eef6f0"/>
  <text x="130" y="136" font-size="14" font-weight="700" fill="#6b6b6b" text-anchor="middle">구분</text>
  <text x="355" y="136" font-size="15" font-weight="700" fill="#c0392b" text-anchor="middle">미국 SBR</text>
  <text x="625" y="136" font-size="15" font-weight="700" fill="#1e7e34" text-anchor="middle">한국 몰수 가상자산 처분</text>

  <!-- row 1: 목적 -->
  <text x="55" y="185" font-size="13" font-weight="700" fill="#333">목적</text>
  <text x="235" y="185" font-size="13" fill="#333">전략적 준비자산으로 장기 비축</text>
  <text x="505" y="185" font-size="13" fill="#333">몰수·압류 자산의 보관·처분 절차 법제화</text>

  <!-- row 2: 방향 -->
  <text x="55" y="245" font-size="13" font-weight="700" fill="#333">기본 방향</text>
  <text x="235" y="245" font-size="13" fill="#333">정부가 시장에서 직접 매입</text>
  <text x="505" y="245" font-size="13" fill="#333">취득 직후 경매를 통한 매각이 원칙</text>

  <!-- row 3: 대상 -->
  <text x="55" y="305" font-size="13" font-weight="700" fill="#333">대상 자산</text>
  <text x="235" y="305" font-size="13" fill="#333">비트코인 (신규 매입분 포함)</text>
  <text x="505" y="305" font-size="13" fill="#333">범죄수익 몰수·압류·기부로 이미 귀속된 코인</text>

  <!-- row 4: 개인 보유분 -->
  <text x="55" y="365" font-size="13" font-weight="700" fill="#333">개인 보유 코인</text>
  <text x="235" y="365" font-size="13" fill="#333">해당 없음</text>
  <text x="505" y="365" font-size="13" fill="#333">해당 없음 (범죄 연루분만 적용)</text>

  <!-- row 5: 시장 영향 -->
  <text x="55" y="425" font-size="13" font-weight="700" fill="#333">시장 영향</text>
  <text x="235" y="425" font-size="13" fill="#333">매수 수요 → 상방 압력</text>
  <text x="505" y="425" font-size="13" fill="#333">매도 물량 → 분할 경매로 충격 최소화</text>
</svg>
