<svg width="820" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
  <defs>
    <marker id="arrowReq2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#263343"/>
    </marker>
    <marker id="arrowRes2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f6feb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="480" fill="#ffffff"/>

  <text x="40" y="42" font-size="21" font-weight="700" fill="rgb(7,7,7)">클로드멤은 세션이 끝나도 맥락을 다음 세션으로 넘긴다</text>
  <text x="40" y="66" font-size="13.5" fill="#6b6b6b">세션 중 작업을 AI로 압축해서 저장해두고, 새 세션 시작 시 관련 맥락만 다시 주입한다</text>

  <!-- Box 1: session A -->
  <rect x="30" y="150" width="200" height="130" rx="10" fill="#263343"/>
  <text x="130" y="192" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">세션 A</text>
  <text x="130" y="216" font-size="12" fill="#a9b3c1" text-anchor="middle">코드 수정, 디버깅</text>
  <text x="130" y="236" font-size="12" fill="#a9b3c1" text-anchor="middle">등 실제 작업 수행</text>

  <!-- Box 2: memory store (highlighted) -->
  <rect x="310" y="120" width="200" height="180" rx="10" fill="#1f6feb"/>
  <text x="410" y="160" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">AI 압축 → 저장</text>
  <text x="410" y="184" font-size="12" fill="#dbe8ff" text-anchor="middle">Chroma 벡터DB</text>
  <text x="410" y="210" font-size="12" fill="#ffffff" text-anchor="middle">시맨틱 검색 지원</text>
  <text x="410" y="234" font-size="12" fill="#ffffff" text-anchor="middle">&lt;private&gt; 태그는</text>
  <text x="410" y="254" font-size="12" fill="#ffffff" text-anchor="middle">저장 제외</text>

  <!-- Box 3: session B -->
  <rect x="590" y="150" width="200" height="130" rx="10" fill="#263343"/>
  <text x="690" y="192" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">세션 B</text>
  <text x="690" y="216" font-size="12" fill="#a9b3c1" text-anchor="middle">관련 맥락을 주입받고</text>
  <text x="690" y="236" font-size="12" fill="#a9b3c1" text-anchor="middle">이어서 작업 시작</text>

  <!-- Arrows -->
  <line x1="230" y1="196" x2="304" y2="196" stroke="#263343" stroke-width="3" marker-end="url(#arrowReq2)"/>
  <text x="267" y="184" font-size="11.5" fill="#263343" text-anchor="middle">압축</text>

  <line x1="510" y1="196" x2="584" y2="196" stroke="#1f6feb" stroke-width="3" marker-end="url(#arrowRes2)"/>
  <text x="547" y="184" font-size="11.5" fill="#1f6feb" text-anchor="middle">주입</text>

  <!-- Footnote -->
  <rect x="30" y="330" width="760" height="110" rx="8" fill="#f4f6f9" stroke="#e1e5eb"/>
  <text x="50" y="358" font-size="13" font-weight="700" fill="rgb(7,7,7)">플러그인 형태로 설치한다</text>
  <text x="50" y="380" font-size="12.5" fill="#3a4a60">npx claude-mem install 한 줄로 설치되고, 이후에는 별도 조작 없이 세션마다 자동으로 동작한다</text>
  <text x="50" y="400" font-size="12.5" fill="#3a4a60">Claude Code 외에 Codex, Gemini, Copilot 등 여러 에이전트에서 같은 방식으로 쓸 수 있다</text>
</svg>
