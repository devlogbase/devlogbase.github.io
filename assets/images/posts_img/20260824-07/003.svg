<svg width="820" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
  <defs>
    <marker id="arrowReq3" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#263343"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="480" fill="#ffffff"/>

  <text x="40" y="42" font-size="21" font-weight="700" fill="rgb(7,7,7)">옴니루트는 여러 클라이언트를 하나의 엔드포인트로 모은다</text>
  <text x="40" y="66" font-size="13.5" fill="#6b6b6b">할당량이 소진되면 구독 → API 키 → 저가 → 무료 순으로 자동 폴백한다</text>

  <!-- Box 1: clients -->
  <rect x="30" y="140" width="190" height="200" rx="10" fill="#263343"/>
  <text x="125" y="176" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">코딩 도구</text>
  <text x="125" y="204" font-size="12" fill="#a9b3c1" text-anchor="middle">Claude Code</text>
  <text x="125" y="226" font-size="12" fill="#a9b3c1" text-anchor="middle">Cursor</text>
  <text x="125" y="248" font-size="12" fill="#a9b3c1" text-anchor="middle">Codex, Cline 등</text>
  <text x="125" y="270" font-size="12" fill="#a9b3c1" text-anchor="middle">33개 도구</text>
  <text x="125" y="300" font-size="12.5" fill="#ffffff" text-anchor="middle">OpenAI 호환</text>
  <text x="125" y="318" font-size="12.5" fill="#ffffff" text-anchor="middle">엔드포인트 하나로 접속</text>

  <!-- Box 2: gateway (highlighted) -->
  <rect x="300" y="120" width="220" height="240" rx="10" fill="#1f6feb"/>
  <text x="410" y="158" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">옴니루트 게이트웨이</text>
  <text x="410" y="184" font-size="12" fill="#dbe8ff" text-anchor="middle">19가지 라우팅 전략</text>
  <text x="410" y="216" font-size="12.5" fill="#ffffff" text-anchor="middle">① 구독</text>
  <text x="410" y="238" font-size="12.5" fill="#ffffff" text-anchor="middle">② API 키</text>
  <text x="410" y="260" font-size="12.5" fill="#ffffff" text-anchor="middle">③ 저가 모델</text>
  <text x="410" y="282" font-size="12.5" fill="#ffffff" text-anchor="middle">④ 무료 모델</text>
  <text x="410" y="312" font-size="11.5" fill="#dbe8ff" text-anchor="middle">할당량 소진 시</text>
  <text x="410" y="330" font-size="11.5" fill="#dbe8ff" text-anchor="middle">순서대로 자동 전환</text>

  <!-- Box 3: providers -->
  <rect x="600" y="140" width="190" height="200" rx="10" fill="#263343"/>
  <text x="695" y="176" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">350개 프로바이더</text>
  <text x="695" y="204" font-size="12" fill="#a9b3c1" text-anchor="middle">Claude, GPT</text>
  <text x="695" y="226" font-size="12" fill="#a9b3c1" text-anchor="middle">Gemini, GLM</text>
  <text x="695" y="248" font-size="12" fill="#a9b3c1" text-anchor="middle">DeepSeek, Kimi 등</text>
  <text x="695" y="270" font-size="12" fill="#a9b3c1" text-anchor="middle">1200개 이상 모델</text>
  <text x="695" y="300" font-size="12.5" fill="#ffffff" text-anchor="middle">90개 이상은</text>
  <text x="695" y="318" font-size="12.5" fill="#ffffff" text-anchor="middle">무료로 제공</text>

  <!-- Arrows -->
  <line x1="220" y1="230" x2="294" y2="230" stroke="#263343" stroke-width="3" marker-end="url(#arrowReq3)"/>
  <line x1="520" y1="230" x2="594" y2="230" stroke="#263343" stroke-width="3" marker-end="url(#arrowReq3)"/>

  <!-- Footnote -->
  <rect x="30" y="390" width="760" height="70" rx="8" fill="#f4f6f9" stroke="#e1e5eb"/>
  <text x="50" y="418" font-size="13" font-weight="700" fill="rgb(7,7,7)">스킬이나 플러그인이 아니라 독립 실행형 서버다</text>
  <text x="50" y="440" font-size="12.5" fill="#3a4a60">npm install -g omniroute로 설치하고, Docker나 데스크톱 앱, 안드로이드 Termux로도 띄울 수 있다</text>
</svg>
