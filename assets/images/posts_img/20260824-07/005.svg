<svg width="820" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
  <defs>
    <marker id="arrowReq4" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#263343"/>
    </marker>
    <marker id="arrowRes4" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f6feb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="480" fill="#ffffff"/>

  <text x="40" y="42" font-size="21" font-weight="700" fill="rgb(7,7,7)">태스크 옵저버는 관찰과 개선을 순환시킨다</text>
  <text x="40" y="66" font-size="13.5" fill="#6b6b6b">세션에서 나온 수정과 판단을 기록해뒀다가, 리뷰를 거쳐 스킬 자체를 고친다</text>

  <!-- Box 1 -->
  <rect x="30" y="150" width="170" height="120" rx="10" fill="#263343"/>
  <text x="115" y="196" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">① 작업 세션</text>
  <text x="115" y="220" font-size="11.5" fill="#a9b3c1" text-anchor="middle">사용자 수정,</text>
  <text x="115" y="238" font-size="11.5" fill="#a9b3c1" text-anchor="middle">판단이 발생</text>

  <!-- Box 2 -->
  <rect x="230" y="150" width="170" height="120" rx="10" fill="#263343"/>
  <text x="315" y="196" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">② 관찰 로그</text>
  <text x="315" y="220" font-size="11.5" fill="#a9b3c1" text-anchor="middle">log.md에</text>
  <text x="315" y="238" font-size="11.5" fill="#a9b3c1" text-anchor="middle">조용히 기록</text>

  <!-- Box 3 -->
  <rect x="430" y="150" width="170" height="120" rx="10" fill="#263343"/>
  <text x="515" y="196" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">③ 정기 리뷰</text>
  <text x="515" y="220" font-size="11.5" fill="#a9b3c1" text-anchor="middle">누적된 관찰을</text>
  <text x="515" y="238" font-size="11.5" fill="#a9b3c1" text-anchor="middle">묶어서 검토</text>

  <!-- Box 4 (highlighted) -->
  <rect x="630" y="140" width="160" height="140" rx="10" fill="#1f6feb"/>
  <text x="710" y="186" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">④ 스킬 개선</text>
  <text x="710" y="210" font-size="11.5" fill="#dbe8ff" text-anchor="middle">기존 스킬 수정 또는</text>
  <text x="710" y="228" font-size="11.5" fill="#dbe8ff" text-anchor="middle">신규 스킬 후보 제안</text>

  <!-- forward arrows -->
  <line x1="200" y1="210" x2="224" y2="210" stroke="#263343" stroke-width="3" marker-end="url(#arrowReq4)"/>
  <line x1="400" y1="210" x2="424" y2="210" stroke="#263343" stroke-width="3" marker-end="url(#arrowReq4)"/>
  <line x1="600" y1="210" x2="624" y2="210" stroke="#263343" stroke-width="3" marker-end="url(#arrowReq4)"/>

  <!-- loop back arrow -->
  <path d="M 710 280 C 710 360, 115 360, 115 276" fill="none" stroke="#1f6feb" stroke-width="3" marker-end="url(#arrowRes4)"/>
  <text x="410" y="352" font-size="12" fill="#1f6feb" text-anchor="middle">개선된 스킬로 다음 작업 세션 진행</text>

  <!-- Footnote -->
  <rect x="30" y="390" width="760" height="70" rx="8" fill="#f4f6f9" stroke="#e1e5eb"/>
  <text x="50" y="418" font-size="13" font-weight="700" fill="rgb(7,7,7)">원래 이름은 one-skill-to-rule-them-all</text>
  <text x="50" y="440" font-size="12.5" fill="#3a4a60">.claude/skills/task-observer 경로에 두면 되고, 자동으로 고치기보다는 개선안을 모아두는 쪽에 가깝다</text>
</svg>
