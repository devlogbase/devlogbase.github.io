<svg width="800" height="380" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="700" fill="rgb(7,7,7)">겉보기 동요와 원곡의 온도차</text>
  <text x="40" y="66" font-size="13" fill="#6b6b6b">제목은 같지만, 담긴 이야기는 전혀 다릅니다</text>

  <!-- Left box: 한국 동요 버전 -->
  <rect x="40" y="90" width="320" height="250" rx="10" fill="#f5f6f8" stroke="#e3e5e9" stroke-width="1"/>
  <text x="200" y="122" font-size="14" font-weight="700" fill="#3a4a60" text-anchor="middle">지금 우리가 아는 동요</text>
  <circle cx="60" cy="152" r="3" fill="#9aa1ab"/>
  <text x="72" y="156" font-size="12" fill="#3a3a3a">다리를 다쳐 걷지 못하는</text>
  <text x="72" y="174" font-size="12" fill="#3a3a3a">바퀴벌레를 귀엽게 그림</text>
  <circle cx="60" cy="200" r="3" fill="#9aa1ab"/>
  <text x="72" y="204" font-size="12" fill="#3a3a3a">밝고 경쾌한 멜로디에</text>
  <text x="72" y="222" font-size="12" fill="#3a3a3a">순화된 가사를 붙임</text>
  <circle cx="60" cy="248" r="3" fill="#9aa1ab"/>
  <text x="72" y="252" font-size="12" fill="#3a3a3a">전쟁이나 정치를 연상시키는</text>
  <text x="72" y="270" font-size="12" fill="#3a3a3a">내용은 거의 남지 않음</text>
  <circle cx="60" cy="296" r="3" fill="#9aa1ab"/>
  <text x="72" y="300" font-size="12" fill="#3a3a3a">어린이 동요로 소비</text>

  <!-- Right box: 멕시코 혁명기 원곡 -->
  <rect x="440" y="90" width="320" height="250" rx="10" fill="#eaf1ff" stroke="#c7dbfb" stroke-width="1"/>
  <text x="600" y="122" font-size="14" font-weight="700" fill="#1f6feb" text-anchor="middle">1910년대 혁명기 원곡</text>
  <circle cx="460" cy="152" r="3" fill="#1f6feb"/>
  <text x="472" y="156" font-size="12" fill="#1a1a1a">우에르타 대통령 등을</text>
  <text x="472" y="174" font-size="12" fill="#1a1a1a">겨냥한 정치 풍자 가사</text>
  <circle cx="460" cy="200" r="3" fill="#1f6feb"/>
  <text x="472" y="204" font-size="12" fill="#1a1a1a">판초 비야 등 혁명 세력을</text>
  <text x="472" y="222" font-size="12" fill="#1a1a1a">가리키는 은유로 쓰임</text>
  <circle cx="460" cy="248" r="3" fill="#1f6feb"/>
  <text x="472" y="252" font-size="12" fill="#1a1a1a">전쟁통 물가·생활고를</text>
  <text x="472" y="270" font-size="12" fill="#1a1a1a">풍자하는 가사도 유행</text>
  <circle cx="460" cy="296" r="3" fill="#1f6feb"/>
  <text x="472" y="300" font-size="12" fill="#1a1a1a">진영마다 가사를 새로 붙인</text>
  <text x="472" y="318" font-size="12" fill="#1a1a1a">'저항가요'로 불림</text>

  <!-- connector -->
  <line x1="360" y1="215" x2="440" y2="215" stroke="#9aa1ab" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="400" y="205" font-size="10.5" fill="#9aa1ab" text-anchor="middle">제목은</text>
  <text x="400" y="232" font-size="10.5" fill="#9aa1ab" text-anchor="middle">동일</text>

  <text x="40" y="365" font-size="11.5" fill="#9aa1ab">가사는 시대와 진영에 따라 계속 바뀌었지만, '바퀴벌레'라는 제목만은 그대로 이어졌습니다</text>
</svg>
