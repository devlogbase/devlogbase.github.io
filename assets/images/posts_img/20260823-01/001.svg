<svg width="820" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Segoe UI', 'Noto Sans KR', system-ui, sans-serif">
  <defs>
    <marker id="arrowReq" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#263343"/>
    </marker>
    <marker id="arrowRes" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f6feb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="480" fill="#ffffff"/>

  <text x="40" y="42" font-size="21" font-weight="700" fill="rgb(7,7,7)">헤드룸(Headroom)은 클로드 코드와 Anthropic API 사이에 끼는 로컬 프록시</text>
  <text x="40" y="66" font-size="13.5" fill="#6b6b6b">ANTHROPIC_BASE_URL을 127.0.0.1:8787로 돌려서, 요청이 API에 닿기 전에 프록시가 가로챈다</text>

  <!-- Box 1: Claude Code -->
  <rect x="30" y="150" width="200" height="110" rx="10" fill="#263343"/>
  <text x="130" y="196" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">클로드 코드</text>
  <text x="130" y="220" font-size="12.5" fill="#dfe3e8" text-anchor="middle">(Claude Code CLI)</text>
  <text x="130" y="240" font-size="11.5" fill="#a9b3c1" text-anchor="middle">대화 전체를 매 턴 전송</text>

  <!-- Box 2: Headroom proxy (highlighted) -->
  <rect x="310" y="130" width="220" height="150" rx="10" fill="#1f6feb"/>
  <text x="420" y="168" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">헤드룸 프록시</text>
  <text x="420" y="190" font-size="12.5" fill="#dbe8ff" text-anchor="middle">127.0.0.1:8787</text>
  <text x="420" y="216" font-size="12" fill="#ffffff" text-anchor="middle">· 오래된 툴 출력 압축</text>
  <text x="420" y="236" font-size="12" fill="#ffffff" text-anchor="middle">· 캐시 재사용</text>
  <text x="420" y="256" font-size="12" fill="#ffffff" text-anchor="middle">· 메모리 관리</text>

  <!-- Box 3: Anthropic API -->
  <rect x="590" y="150" width="200" height="110" rx="10" fill="#263343"/>
  <text x="690" y="196" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Anthropic API</text>
  <text x="690" y="220" font-size="12.5" fill="#dfe3e8" text-anchor="middle">(claude-opus-5 등)</text>
  <text x="690" y="240" font-size="11.5" fill="#a9b3c1" text-anchor="middle">압축된 요청만 수신</text>

  <!-- Request arrows (top) -->
  <line x1="230" y1="178" x2="304" y2="178" stroke="#263343" stroke-width="3" marker-end="url(#arrowReq)"/>
  <text x="267" y="164" font-size="11.5" fill="#263343" text-anchor="middle">① 요청</text>

  <line x1="530" y1="178" x2="584" y2="178" stroke="#263343" stroke-width="3" marker-end="url(#arrowReq)"/>
  <text x="557" y="164" font-size="11.5" fill="#263343" text-anchor="middle">② 압축 후 전달</text>

  <!-- Response arrows (bottom) -->
  <line x1="584" y1="232" x2="530" y2="232" stroke="#1f6feb" stroke-width="3" marker-end="url(#arrowRes)"/>
  <text x="557" y="250" font-size="11.5" fill="#1f6feb" text-anchor="middle">③ 응답</text>

  <line x1="304" y1="232" x2="230" y2="232" stroke="#1f6feb" stroke-width="3" marker-end="url(#arrowRes)"/>
  <text x="267" y="250" font-size="11.5" fill="#1f6feb" text-anchor="middle">④ 응답 전달</text>

  <!-- Footnote -->
  <rect x="30" y="330" width="760" height="90" rx="8" fill="#f4f6f9" stroke="#e1e5eb"/>
  <text x="50" y="358" font-size="13" font-weight="700" fill="rgb(7,7,7)">wrap과 init, 프록시를 붙이는 방식이 다르다</text>
  <text x="50" y="380" font-size="12.5" fill="#3a4a60">headroom wrap claude → 실행할 때마다 프록시를 띄우고 그 세션에서만 라우팅 (일회성)</text>
  <text x="50" y="400" font-size="12.5" fill="#3a4a60">headroom init claude --global → 훅과 설정에 영구 등록, 이후 claude 실행 시 항상 라우팅</text>
</svg>
